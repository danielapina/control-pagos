<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Control de Pagos</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f1f3f5;--card:#fff;--text:#212529;--muted:#6c757d;--border:#dee2e6;
  --radius:14px;--radius-sm:8px;
  --green:#1D9E75;--green-bg:#E1F5EE;--green-dark:#085041;
  --orange:#D85A30;--orange-bg:#FAECE7;--orange-dark:#4A1B0C;
  --amber:#F4A820;--amber-bg:#FEF3DC;--amber-dark:#7A4F00;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:90px}
#lockScreen{position:fixed;inset:0;background:#1B4332;display:flex;align-items:center;justify-content:center;z-index:9999}
.lock-box{background:#fff;border-radius:20px;padding:36px 28px;width:300px;max-width:90vw;text-align:center}
.lock-box .icon{font-size:44px;margin-bottom:10px}
.lock-box h2{font-size:20px;font-weight:700;color:#1B4332;margin-bottom:4px}
.lock-box p{font-size:13px;color:var(--muted);margin-bottom:20px}
.lock-box input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;outline:none;margin-bottom:8px}
.lock-box input:focus{border-color:var(--green)}
.lock-error{color:var(--orange);font-size:12px;margin-bottom:8px;display:none}
.lock-btn{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer}
.topbar{position:sticky;top:0;z-index:50;background:#1B4332;color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.topbar h1{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-btn{background:rgba(255,255,255,.15);border:none;border-radius:8px;width:34px;height:34px;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.topbar-btn:active{transform:scale(.92)}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#74C69D;display:inline-block;transition:background .3s}
.sync-dot.saving{background:var(--amber);animation:pulse 1s infinite}
.sync-dot.error{background:#ff6b6b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.month-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.month-nav-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--text)}
.month-label{font-size:17px;font-weight:700}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.stat-value{font-size:28px;font-weight:700}
.stat-value.green{color:var(--green)}.stat-value.orange{color:var(--orange)}.stat-value.amber{color:var(--amber)}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:90px;padding:12px 8px;font-size:13px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;text-align:center;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.tab.active{color:var(--green);border-bottom-color:var(--green);font-weight:700}
.section{display:none;padding:12px 16px}.section.active{display:block}
.client-card{background:var(--card);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.client-head{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.client-info{flex:1;min-width:0}
.client-name{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.client-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px}
.icon-btn{background:var(--bg);border:none;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--muted)}
.icon-btn.edit{color:#0078d4}.icon-btn.del{color:var(--orange)}
.periods-row{padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:8px}
.period-item{display:flex;flex-direction:column;align-items:center;gap:4px}
.period-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase}
.period-btn{width:54px;height:54px;border-radius:12px;border:2px solid var(--border);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.period-btn:active{transform:scale(.92)}
.period-btn.paid{background:var(--green);border-color:var(--green)}
.period-btn.abono{background:var(--amber-bg);border-color:var(--amber)}
.pb-icon{font-size:22px;color:var(--muted)}
.period-btn.paid .pb-icon{color:#fff}
.period-btn.abono .pb-icon{color:var(--amber-dark)}
.pb-monto{font-size:9px;font-weight:700;color:var(--amber-dark);max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.paid{background:var(--green-bg);color:var(--green-dark)}
.badge.partial{background:#EBF4FF;color:#004a99}
.badge.abono-only{background:var(--amber-bg);color:var(--amber-dark)}
.badge.pending{background:var(--orange-bg);color:var(--orange-dark)}
.fab{position:fixed;bottom:22px;right:20px;width:60px;height:60px;border-radius:50%;background:var(--green);color:#fff;border:none;font-size:30px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(29,158,117,.4);z-index:40}
.fab:active{transform:scale(.93)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:20px 20px 40px;max-height:90vh;overflow-y:auto}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal h2{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--card);color:var(--text);outline:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--green)}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer;border:none}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:disabled{opacity:.6}
.btn-secondary{background:var(--bg);color:var(--text)}
.pay-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.pay-option{padding:18px 10px;border:2px solid var(--border);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all .12s}
.pay-option:active{transform:scale(.96)}
.pay-option.sel-paid{border-color:var(--green);background:var(--green-bg)}
.pay-option.sel-abono{border-color:var(--amber);background:var(--amber-bg)}
.pay-option i{font-size:30px;display:block;margin-bottom:6px;color:var(--muted)}
.pay-option.sel-paid i{color:var(--green)}
.pay-option.sel-abono i{color:var(--amber)}
.pay-option span{font-size:14px;font-weight:700}
.clear-btn{width:100%;padding:12px;background:var(--orange-bg);color:var(--orange-dark);border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;display:none}
.clear-btn.show{display:block}
.monto-wrap{display:none}.monto-wrap.show{display:block}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state i{font-size:40px;display:block;margin-bottom:10px}
.report-line{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.report-line:last-child{border-bottom:none}
.report-group-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:14px 0 4px}
.report-total{display:flex;justify-content:space-between;font-size:16px;font-weight:700;margin-top:14px;padding-top:10px;border-top:2px solid var(--border)}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <div class="icon">🔐</div>
    <h2>Control de Pagos</h2>
    <p>Ingresa tus datos para continuar</p>
    <input type="text" id="cobradorInput" placeholder="Nombre del cobrador" onkeydown="if(event.key==='Enter')document.getElementById('pwdInput').focus()"/>
    <input type="password" id="pwdInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter')checkPwd()"/>
    <div class="lock-error" id="pwdError">Contraseña incorrecta</div>
    <button class="lock-btn" onclick="checkPwd()">Entrar</button>
  </div>
</div>

<div class="topbar">
  <h1><i class="ti ti-receipt"></i> Control de Pagos</h1>
  <div class="topbar-right">
    <button class="topbar-btn" title="Enviar reporte del día" onclick="openReportModal()"><i class="ti ti-mail"></i></button>
    <span class="sync-dot" id="syncDot"></span>
  </div>
</div>

<div class="month-bar">
  <button class="month-nav-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
  <span class="month-label" id="monthLabel"></span>
  <button class="month-nav-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
</div>

<div class="summary">
  <div class="stat"><div class="stat-label">Recibos pagados</div><div class="stat-value green" id="sumPaid">0</div><div class="stat-sub" id="sumPaidAmt"></div></div>
  <div class="stat"><div class="stat-label">Pendientes</div><div class="stat-value orange" id="sumPending">0</div></div>
  <div class="stat"><div class="stat-label">Con abono</div><div class="stat-value amber" id="sumAbono">0</div><div class="stat-sub" id="sumAbonoAmt"></div></div>
  <div class="stat"><div class="stat-label">% cobrado</div><div class="stat-value" id="sumPct">0%</div></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('mensual',this)"><i class="ti ti-calendar-month"></i> Mensual</div>
  <div class="tab" onclick="switchTab('quincenal',this)"><i class="ti ti-calendar-week"></i> Quincenal</div>
  <div class="tab" onclick="switchTab('semanal',this)"><i class="ti ti-calendar"></i> Semanal</div>
</div>

<div id="mensual" class="section active"><div id="list-mensual"></div></div>
<div id="quincenal" class="section"><div id="list-quincenal"></div></div>
<div id="semanal" class="section"><div id="list-semanal"></div></div>

<button class="fab" onclick="openAddModal()"><i class="ti ti-plus"></i></button>

<!-- Client modal -->
<div class="modal-overlay" id="clientModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="clientModalTitle"><i class="ti ti-user-plus" style="color:var(--green)"></i> Agregar cliente</h2>
    <input type="hidden" id="edit-id"/>
    <div class="field"><label>Nombre del cliente</label><input type="text" id="c-name" placeholder="Ej: Juan García"/></div>
    <div class="field"><label>Frecuencia de pago</label>
      <select id="c-freq">
        <option value="mensual">Mensual</option>
        <option value="quincenal">Quincenal</option>
        <option value="semanal">Semanal</option>
      </select>
    </div>
    <div class="field"><label>Monto del recibo ($)</label><input type="number" id="c-amount" placeholder="Ej: 500"/></div>
    <div class="field"><label>Dirección / Notas</label><input type="text" id="c-notes" placeholder="Ej: Calle 5 #12, Col. Centro"/></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeClientModal()">Cancelar</button>
      <button class="btn btn-primary" id="clientModalBtn" onclick="saveClient()">Agregar</button>
    </div>
  </div>
</div>

<!-- Payment modal -->
<div class="modal-overlay" id="payModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2><i class="ti ti-cash" style="color:var(--green)"></i> Registrar pago</h2>
    <p id="payModalSub" style="font-size:14px;color:var(--muted);margin-bottom:16px;margin-top:-8px;font-weight:500;"></p>
    <input type="hidden" id="pay-clientId"/>
    <input type="hidden" id="pay-periodKey"/>
    <button class="clear-btn" id="clearBtn" onclick="clearPay()"><i class="ti ti-x"></i> Quitar registro de pago</button>
    <div class="pay-options">
      <div class="pay-option" id="opt-paid" onclick="selectPayOption('paid')">
        <i class="ti ti-circle-check"></i><span>Pagado completo</span>
      </div>
      <div class="pay-option" id="opt-abono" onclick="selectPayOption('abono')">
        <i class="ti ti-coin"></i><span>Abono parcial</span>
      </div>
    </div>
    <div class="monto-wrap field" id="abonoWrap">
      <label>Monto del abono ($)</label>
      <input type="number" id="pay-monto" placeholder="Ej: 250"/>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closePayModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmPay()">Confirmar</button>
    </div>
  </div>
</div>

<!-- Report modal -->
<div class="modal-overlay" id="reportModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2><i class="ti ti-mail" style="color:var(--green)"></i> Reporte de cobranza del día</h2>
    <p id="reportSub" style="font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;"></p>
    <div id="reportPreview"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeReportModal()">Cerrar</button>
      <button class="btn btn-primary" id="sendReportBtn" onclick="sendReportEmail()">Enviar por correo</button>
    </div>
  </div>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx8z_qgijwpb4zDw-dYh3OCWv_nKThNINDmfDn1XH-qu9FfNvN8VwPJGWySRB6teEqT/exec';
const ACCESS_PASSWORD = 'cobranza2024';
const REPORT_EMAIL = 'administracion@r2recolectora.com.mx';
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let curYear=new Date().getFullYear(), curMonth=new Date().getMonth();
let clients=[], nextId=1, syncTimeout=null, isSaving=false, payOption=null;
let currentCobrador = sessionStorage.getItem('cobrador') || '';

// Auth
function checkPwd() {
  const pwd = document.getElementById('pwdInput').value;
  const nombre = document.getElementById('cobradorInput').value.trim();
  const err = document.getElementById('pwdError');
  if (!nombre) {
    err.textContent = 'Ingresa el nombre del cobrador';
    err.style.display = 'block';
    document.getElementById('cobradorInput').focus();
    return;
  }
  if (pwd !== ACCESS_PASSWORD) {
    err.textContent = 'Contraseña incorrecta';
    err.style.display = 'block';
    document.getElementById('pwdInput').value = '';
    document.getElementById('pwdInput').focus();
    return;
  }
  currentCobrador = nombre;
  sessionStorage.setItem('cobrador', nombre);
  sessionStorage.setItem('auth', '1');
  document.getElementById('lockScreen').style.display = 'none';
  loadData();
}
if (sessionStorage.getItem('auth') === '1' && currentCobrador) {
  document.getElementById('lockScreen').style.display = 'none';
} else {
  sessionStorage.removeItem('auth');
}
setTimeout(()=>{ const i=document.getElementById('cobradorInput'); if(i) i.focus(); },150);

// Sync
function setSyncStatus(s) {
  const d=document.getElementById('syncDot');
  d.className='sync-dot'+(s==='saving'?' saving':s==='error'?' error':'');
}
async function loadData() {
  setSyncStatus('saving');
  try {
    const r=await fetch(SHEET_URL+'?t='+Date.now()); const t=await r.text();
    if(t&&t!=='{}'&&t.trim().startsWith('{')){const d=JSON.parse(t);clients=d.clients||[];nextId=d.nextId||1;}
    else loadLocal();
    render(); setSyncStatus('ok');
  } catch(e){loadLocal();render();setSyncStatus('error');}
}
async function saveData() {
  if(isSaving) return; isSaving=true; setSyncStatus('saving');
  try{ await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({clients,nextId}),headers:{'Content-Type':'text/plain'}}); setSyncStatus('ok'); }
  catch(e){ setSyncStatus('error'); }
  isSaving=false;
}
function scheduleSave(){saveLocal();clearTimeout(syncTimeout);syncTimeout=setTimeout(saveData,1000);}
function saveLocal(){try{localStorage.setItem('cpagos_v3',JSON.stringify({clients,nextId}));}catch(e){}}
function loadLocal(){try{const s=localStorage.getItem('cpagos_v3');if(s){const d=JSON.parse(s);clients=d.clients||[];nextId=d.nextId||1;}}catch(e){}}

// Data
function monthKey(){return `${curYear}-${String(curMonth+1).padStart(2,'0')}`;}
function periodsForMonth(freq,year=curYear,month=curMonth){
  if(freq==='mensual') return [{label:'Mes',key:'01'}];
  if(freq==='quincenal') return [{label:'1ª Q',key:'q1'},{label:'2ª Q',key:'q2'}];
  const d=new Date(year,month+1,0).getDate();
  return Array.from({length:d<=28?4:5},(_,i)=>({label:`Sem ${i+1}`,key:`w${i+1}`}));
}
function getPD(c,k){const m=monthKey();return(c.payments[m]&&c.payments[m][k])||null;}
function setPD(c,k,v){const m=monthKey();if(!c.payments[m])c.payments[m]={};c.payments[m][k]=v;}
function isPaidEntry(d){return d===true||d==='paid'||(d&&typeof d==='object'&&d.type==='paid');}
function isAbonoEntry(d){return !!(d&&typeof d==='object'&&d.type==='abono');}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// Render
function periodBtnHTML(c,p){
  const d=getPD(c,p.key);
  let cls='',icon='<i class="ti ti-circle pb-icon"></i>',monto='';
  if(isPaidEntry(d)){cls='paid';icon='<i class="ti ti-check pb-icon"></i>';}
  else if(isAbonoEntry(d)){cls='abono';icon='<i class="ti ti-coin pb-icon"></i>';monto=`<span class="pb-monto">$${Number(d.monto).toLocaleString('es-MX')}</span>`;}
  return `<div class="period-item"><span class="period-lbl">${p.label}</span><button class="period-btn ${cls}" onclick="openPayModal(${c.id},'${p.key}')">${icon}${monto}</button></div>`;
}
function getStatusBadge(c){
  const ps=periodsForMonth(c.freq);let paid=0,abonos=0;
  ps.forEach(p=>{const d=getPD(c,p.key);if(isPaidEntry(d))paid++;else if(isAbonoEntry(d))abonos++;});
  const t=ps.length;
  if(paid===t) return `<span class="badge paid"><i class="ti ti-check"></i> Al corriente</span>`;
  if(paid>0)   return `<span class="badge partial">${paid}/${t} pagados</span>`;
  if(abonos>0) return `<span class="badge abono-only"><i class="ti ti-coin"></i> Con abono</span>`;
  return `<span class="badge pending"><i class="ti ti-clock"></i> Pendiente</span>`;
}
function renderList(freq,cid){
  const list=clients.filter(c=>c.freq===freq),el=document.getElementById(cid);
  if(!list.length){el.innerHTML=`<div class="empty-state"><i class="ti ti-users"></i>No hay clientes aquí.<br>Toca <b>+</b> para agregar uno.</div>`;return;}
  el.innerHTML=list.map(c=>{
    const ps=periodsForMonth(c.freq);
    const btns=ps.map(p=>periodBtnHTML(c,p)).join('');
    const amt=c.amount?`$${Number(c.amount).toLocaleString('es-MX')}`:'';
    return `<div class="client-card">
      <div class="client-head">
        <div class="client-info">
          <div class="client-name">${c.name}</div>
          <div class="client-meta">${amt?`<span>${amt}</span>`:''} ${c.notes?`<span>· ${c.notes}</span>`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${getStatusBadge(c)}
          <div style="display:flex;gap:6px;">
            <button class="icon-btn edit" onclick="openEditModal(${c.id})"><i class="ti ti-pencil"></i></button>
            <button class="icon-btn del"  onclick="deleteClient(${c.id})"><i class="ti ti-trash"></i></button>
          </div>
        </div>
      </div>
      <div class="periods-row">${btns}</div>
    </div>`;
  }).join('');
}
function updateSummary(){
  let paid=0,pending=0,abonos=0,total=0,paidAmt=0,abonoAmt=0;
  clients.forEach(c=>periodsForMonth(c.freq).forEach(p=>{
    total++;const d=getPD(c,p.key);
    if(isPaidEntry(d)){paid++;if(c.amount)paidAmt+=Number(c.amount);}
    else if(isAbonoEntry(d)){abonos++;abonoAmt+=Number(d.monto||0);}
    else pending++;
  }));
  document.getElementById('sumPaid').textContent=paid;
  document.getElementById('sumPending').textContent=pending;
  document.getElementById('sumAbono').textContent=abonos;
  document.getElementById('sumPct').textContent=total?Math.round(paid/total*100)+'%':'0%';
  document.getElementById('sumPaidAmt').textContent=paidAmt?`$${paidAmt.toLocaleString('es-MX')}`:'' ;
  document.getElementById('sumAbonoAmt').textContent=abonoAmt?`$${abonoAmt.toLocaleString('es-MX')}`:'' ;
}
function render(){
  document.getElementById('monthLabel').textContent=`${MONTHS[curMonth]} ${curYear}`;
  renderList('mensual','list-mensual');renderList('quincenal','list-quincenal');renderList('semanal','list-semanal');
  updateSummary();
}
function switchTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');document.getElementById(id).classList.add('active');
}
function changeMonth(dir){curMonth+=dir;if(curMonth>11){curMonth=0;curYear++;}if(curMonth<0){curMonth=11;curYear--;}render();}

// Pay modal
function openPayModal(clientId,periodKey){
  const c=clients.find(x=>x.id===clientId);if(!c)return;
  const p=periodsForMonth(c.freq).find(x=>x.key===periodKey);
  document.getElementById('pay-clientId').value=clientId;
  document.getElementById('pay-periodKey').value=periodKey;
  document.getElementById('payModalSub').textContent=`${c.name} · ${p?p.label:''}`;
  payOption=null;
  document.getElementById('opt-paid').className='pay-option';
  document.getElementById('opt-abono').className='pay-option';
  document.getElementById('abonoWrap').classList.remove('show');
  document.getElementById('pay-monto').value='';
  const current=getPD(c,periodKey);
  document.getElementById('clearBtn').className='clear-btn'+(current?' show':'');
  if(isPaidEntry(current)) selectPayOption('paid');
  else if(isAbonoEntry(current)){selectPayOption('abono');document.getElementById('pay-monto').value=current.monto;}
  document.getElementById('payModal').classList.add('open');
}
function closePayModal(){document.getElementById('payModal').classList.remove('open');}
function selectPayOption(opt){
  payOption=opt;
  document.getElementById('opt-paid').className='pay-option'+(opt==='paid'?' sel-paid':'');
  document.getElementById('opt-abono').className='pay-option'+(opt==='abono'?' sel-abono':'');
  opt==='abono'?document.getElementById('abonoWrap').classList.add('show'):document.getElementById('abonoWrap').classList.remove('show');
  if(opt==='abono') setTimeout(()=>document.getElementById('pay-monto').focus(),100);
}
function clearPay(){
  const c=clients.find(x=>x.id===parseInt(document.getElementById('pay-clientId').value));if(!c)return;
  setPD(c,document.getElementById('pay-periodKey').value,null);
  scheduleSave();render();closePayModal();
}
function confirmPay(){
  if(!payOption)return;
  const c=clients.find(x=>x.id===parseInt(document.getElementById('pay-clientId').value));if(!c)return;
  const k=document.getElementById('pay-periodKey').value;
  if(payOption==='paid'){
    setPD(c,k,{type:'paid',date:todayISO(),cobrador:currentCobrador});
  } else {
    const m=document.getElementById('pay-monto').value;
    if(!m){document.getElementById('pay-monto').focus();return;}
    setPD(c,k,{type:'abono',monto:Number(m),date:todayISO(),cobrador:currentCobrador});
  }
  scheduleSave();render();closePayModal();
}

// Client modal
function openAddModal(){
  document.getElementById('edit-id').value='';
  ['c-name','c-amount','c-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('c-freq').value='mensual';
  document.getElementById('clientModalTitle').innerHTML='<i class="ti ti-user-plus" style="color:var(--green)"></i> Agregar cliente';
  document.getElementById('clientModalBtn').textContent='Agregar';
  document.getElementById('clientModal').classList.add('open');
  setTimeout(()=>document.getElementById('c-name').focus(),100);
}
function openEditModal(id){
  const c=clients.find(x=>x.id===id);if(!c)return;
  document.getElementById('edit-id').value=c.id;
  document.getElementById('c-name').value=c.name;
  document.getElementById('c-freq').value=c.freq;
  document.getElementById('c-amount').value=c.amount;
  document.getElementById('c-notes').value=c.notes||'';
  document.getElementById('clientModalTitle').innerHTML='<i class="ti ti-pencil" style="color:var(--green)"></i> Editar cliente';
  document.getElementById('clientModalBtn').textContent='Guardar cambios';
  document.getElementById('clientModal').classList.add('open');
  setTimeout(()=>document.getElementById('c-name').focus(),100);
}
function closeClientModal(){document.getElementById('clientModal').classList.remove('open');}
function saveClient(){
  const name=document.getElementById('c-name').value.trim();if(!name){document.getElementById('c-name').focus();return;}
  const freq=document.getElementById('c-freq').value,amount=document.getElementById('c-amount').value,notes=document.getElementById('c-notes').value.trim();
  const editId=document.getElementById('edit-id').value;
  if(editId){const c=clients.find(x=>x.id===parseInt(editId));if(c){c.name=name;c.freq=freq;c.amount=amount;c.notes=notes;}}
  else{
    clients.push({id:nextId++,name,freq,amount,notes,payments:{}});
    const tabMap={mensual:0,quincenal:1,semanal:2};
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tab')[tabMap[freq]].classList.add('active');
    document.querySelectorAll('.section')[tabMap[freq]].classList.add('active');
  }
  scheduleSave();closeClientModal();render();
}
function deleteClient(id){
  if(!confirm('¿Eliminar este cliente?'))return;
  clients=clients.filter(c=>c.id!==id);scheduleSave();render();
}

// ---- Reporte diario ----
function generateTodayReport(){
  const today=todayISO();
  const rows=[];
  clients.forEach(c=>{
    Object.keys(c.payments||{}).forEach(mKey=>{
      const parts=mKey.split('-').map(Number);
      const y=parts[0], m=parts[1];
      if(!y||!m) return;
      const ps=periodsForMonth(c.freq,y,m-1);
      Object.keys(c.payments[mKey]).forEach(pKey=>{
        const d=c.payments[mKey][pKey];
        if(!d||typeof d!=='object'||!d.date||d.date!==today) return;
        const p=ps.find(x=>x.key===pKey);
        const label=p?p.label:pKey;
        if(d.type==='paid'){
          rows.push({client:c.name,period:label,type:'Completo',amount:Number(c.amount)||0});
        } else if(d.type==='abono'){
          rows.push({client:c.name,period:label,type:'Parcial',amount:Number(d.monto)||0});
        }
      });
    });
  });
  return rows;
}
function buildReportText(rows){
  const today=todayISO();
  const completos=rows.filter(r=>r.type==='Completo');
  const parciales=rows.filter(r=>r.type==='Parcial');
  const total=rows.reduce((s,r)=>s+r.amount,0);
  const lines=[];
  lines.push(`Reporte de cobranza - ${today}`);
  lines.push(`Cobrador: ${currentCobrador}`);
  lines.push('');
  lines.push(`PAGOS COMPLETOS (${completos.length}):`);
  if(!completos.length) lines.push('  (ninguno)');
  completos.forEach(r=>lines.push(`  - ${r.client} (${r.period}): $${r.amount.toLocaleString('es-MX')}`));
  lines.push('');
  lines.push(`ABONOS PARCIALES (${parciales.length}):`);
  if(!parciales.length) lines.push('  (ninguno)');
  parciales.forEach(r=>lines.push(`  - ${r.client} (${r.period}): $${r.amount.toLocaleString('es-MX')}`));
  lines.push('');
  lines.push(`TOTAL COBRADO: $${total.toLocaleString('es-MX')}`);
  return lines.join('\n');
}
function openReportModal(){
  const rows=generateTodayReport();
  const completos=rows.filter(r=>r.type==='Completo');
  const parciales=rows.filter(r=>r.type==='Parcial');
  const total=rows.reduce((s,r)=>s+r.amount,0);
  document.getElementById('reportSub').textContent=`${currentCobrador||'(sin nombre)'} · ${todayISO()}`;
  let html='';
  html+=`<div class="report-group-title">Pagos completos (${completos.length})</div>`;
  html+=completos.length?completos.map(r=>`<div class="report-line"><span>${r.client} <span style="color:var(--muted)">(${r.period})</span></span><span>$${r.amount.toLocaleString('es-MX')}</span></div>`).join(''):`<div style="font-size:13px;color:var(--muted);padding:4px 0;">Ninguno todavía</div>`;
  html+=`<div class="report-group-title">Abonos parciales (${parciales.length})</div>`;
  html+=parciales.length?parciales.map(r=>`<div class="report-line"><span>${r.client} <span style="color:var(--muted)">(${r.period})</span></span><span>$${r.amount.toLocaleString('es-MX')}</span></div>`).join(''):`<div style="font-size:13px;color:var(--muted);padding:4px 0;">Ninguno todavía</div>`;
  html+=`<div class="report-total"><span>Total cobrado</span><span>$${total.toLocaleString('es-MX')}</span></div>`;
  document.getElementById('reportPreview').innerHTML=html;
  document.getElementById('reportModal').classList.add('open');
}
function closeReportModal(){document.getElementById('reportModal').classList.remove('open');}
async function sendReportEmail(){
  const rows=generateTodayReport();
  const body=buildReportText(rows);
  const subject=`Reporte de cobranza ${todayISO()} - ${currentCobrador}`;
  const btn=document.getElementById('sendReportBtn');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}
  let sentOk=false;
  try{
    const r=await fetch(SHEET_URL,{method:'POST',body:JSON.stringify({action:'sendReport',to:REPORT_EMAIL,subject,body,cobrador:currentCobrador,date:todayISO()}),headers:{'Content-Type':'text/plain'}});
    const t=await r.text();
    try{ sentOk = JSON.parse(t).ok===true; }catch(e){ sentOk=false; }
  }catch(e){ sentOk=false; }
  if(btn){btn.disabled=false;btn.textContent='Enviar por correo';}
  if(sentOk){
    alert('Reporte enviado a '+REPORT_EMAIL);
    closeReportModal();
  } else {
    // Respaldo: abre la app de correo con el reporte ya escrito
    const mailto=`mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href=mailto;
  }
}

['clientModal','payModal','reportModal'].forEach(mid=>{
  document.getElementById(mid).addEventListener('click',e=>{if(e.target===document.getElementById(mid))document.getElementById(mid).classList.remove('open');});
});

if(sessionStorage.getItem('auth')==='1' && currentCobrador) loadData();
else{loadLocal();render();}
